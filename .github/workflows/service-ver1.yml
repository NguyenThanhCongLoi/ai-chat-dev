name: Service ver1 package
on:
  push:
    branches: [integration/service-ver1]
  pull_request:
    branches: [integration/service-ver1]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q tests/test_service_package.py
      - run: docker build -t ai-companion:test .
      - name: Start isolated container
        run: docker run -d --name companion -p 127.0.0.1:8000:8000 -e DOCS_USERNAME=smoke -e DOCS_PASSWORD=ci-test-only -e REACTION_GENERATOR_MODE=disabled ai-companion:test
      - name: Wait and smoke test
        env:
          DOCS_USERNAME: smoke
          DOCS_PASSWORD: ci-test-only
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          python scripts/smoke_service.py --admin
      - name: Container logs
        if: always()
        run: docker logs companion || true
