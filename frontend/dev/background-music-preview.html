<!doctype html><html><head><meta charset="utf-8"></head><body><div id="root"></div>
<script type="module">
import React,{useState} from "react";import{createRoot}from"react-dom/client";
import{useBackgroundMusic}from"/src/roleplay/useBackgroundMusic.ts";
import{BackgroundMusicButton}from"/src/roleplay/BackgroundMusicButton.tsx";
function Preview(){const[room,setRoom]=useState(null),[voice,setVoice]=useState(false);
const music=useBackgroundMusic(true,voice,room);
return React.createElement("section",{},React.createElement(BackgroundMusicButton,music),
React.createElement("button",{id:"voice",onClick:()=>setVoice(!voice)},"Voice"),
React.createElement("button",{id:"enter",onClick:()=>setRoom("r")},"Enter chat"),
React.createElement("button",{id:"another",onClick:()=>setRoom("r2")},"Another chat"),
React.createElement("button",{id:"exit",onClick:()=>setRoom(null)},"Exit chat"));}
createRoot(document.getElementById("root")).render(React.createElement(Preview));
</script></body></html>
