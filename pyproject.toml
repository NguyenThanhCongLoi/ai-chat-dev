[project]
name = "character-chat"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2", "pydantic>=2", "python-multipart>=0.0.9", "httpx>=0.27", "pillow>=10.4", "pymupdf>=1.24", "python-docx>=1.1", "python-pptx>=1.0", "openpyxl>=3.1", "cryptography>=43"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Retained only for legacy GPU deployments; the standalone Docker image does not install this extra.
modal = ["modal>=1.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["character_chat*"]

[tool.setuptools.package-data]
character_chat = ["tarot_deck.json", "story_data/*.json", "story_data/moonfall_arc/*.json"]
